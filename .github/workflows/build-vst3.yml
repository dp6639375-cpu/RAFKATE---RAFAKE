name: Build VST3 Plugin

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Build VST3 (x64)
        shell: pwsh
        run: |
          cmake -B build -A x64
          cmake --build build --config Release

      - name: Upload Windows VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vst3-windows-x64
          path: "**/*.vst3"

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -B build -G Xcode

      - name: Build VST3 (Universal)
        run: cmake --build build --config Release

      - name: Upload macOS VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vst3-macos
          path: "**/*.vst3"

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install audio/build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libasound2-dev libfreetype6-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev

      - name: Configure and Build VST3
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Upload Linux VST3 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vst3-linux
          path: "**/*.vst3"
